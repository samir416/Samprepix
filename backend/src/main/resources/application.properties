spring.datasource.url=jdbc:mysql://localhost:3306/ai_platform
spring.datasource.username=root
spring.datasource.password=SAMIR

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#################################################
# Application Frontend URL
#################################################

app.frontend.url=http://localhost:5173

# Groq Configuration
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile
groq.api.key=${GROQ_API_KEY}

# Gemini Configuration
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
gemini.api.key=${GEMINI_API_KEY}

#################################################
# Gmail SMTP Configuration
#################################################

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#################################################
# Feedback Moderation Configuration
#################################################

feedback.moderation.owner-email=${FEEDBACK_OWNER_EMAIL}
feedback.moderation.base-url=http://localhost:8080

#################################################
# Google OAuth2
#################################################

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

#################################################
# GitHub OAuth2
#################################################

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

