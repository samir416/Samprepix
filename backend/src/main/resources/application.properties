spring.datasource.url=jdbc:mysql://localhost:3306/ai_platform
spring.datasource.username=root
spring.datasource.password=SAMIR

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# Coding Problems Dataset Import
coding.problems.import-resource=classpath:coding-problems/problems.jsonl

#################################################
# Application Frontend URL
#################################################

app.frontend.url=http://localhost:5173

# Groq Configuration
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile
groq.coding-hint.model=${GROQ_CODING_HINT_MODEL:openai/gpt-oss-120b}
groq.api.key=${GROQ_API_KEY}

# Gemini Configuration
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
gemini.api.key=${GEMINI_API_KEY}

#################################################
# Gmail SMTP Configuration
#################################################

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#################################################
# Feedback Moderation Configuration
#################################################

feedback.moderation.owner-email=${FEEDBACK_OWNER_EMAIL}
feedback.moderation.base-url=http://localhost:8080

#################################################
# Google OAuth2
#################################################

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

#################################################
# GitHub OAuth2
#################################################

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user,repo

app.upload.dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
resume.max-file-size=10485760

app.piston.url=http://localhost:2000/api/v2/execute
coding.hint.ollama.url=http://localhost:11434
coding.hint.ollama.model=mistral:latest

app.jwt.secret=your-super-secret-key-at-least-32-characters-long

#################################################
# Razorpay Configuration (Test Mode)
#################################################

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_mock_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_test_mock_key_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:rzp_test_webhook_secret_placeholder}

#################################################
# Pricing Configuration
#################################################

# Production pricing
plan.production.price.starter=0.0
plan.production.price.pro=399.0
plan.production.price.elite=799.0
plan.production.price.usd.pro=8.0
plan.production.price.usd.elite=18.0

# Test mode pricing
plan.test.price.pro=1.0
plan.test.price.elite=2.0

# Referral discounts (India)
plan.referral.discount.india.pro=299.0
plan.referral.discount.india.elite=699.0

# Referral discounts (International)
plan.referral.discount.international.pro=8.0
plan.referral.discount.international.elite=18.0

#################################################
# Pricing Configuration
#################################################

plan.price.pro.test-inr=1.0
plan.price.pro.test-usd=1.0
plan.price.pro.prod-inr=399.0
plan.price.pro.prod-usd=8.0
plan.price.elite.test-inr=2.0
plan.price.elite.test-usd=2.0
plan.price.elite.prod-inr=799.0
plan.price.elite.prod-usd=18.0
plan.price.starter.test-inr=0.0
plan.price.starter.prod-inr=0.0

#################################################
# Invoice Configuration
#################################################

invoice.number.prefix=INV
invoice.due.days=30
