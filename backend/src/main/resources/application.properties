# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ai_platform
spring.datasource.username=root
spring.datasource.password=SAMIR

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true


# =========================================================
# CODING PROBLEMS DATASET
# =========================================================

coding.problems.import-resource=classpath:coding-problems/problems.jsonl


# =========================================================
# APPLICATION
# =========================================================

app.frontend.url=http://localhost:5173


# =========================================================
# GROQ
# =========================================================

groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile
groq.coding-hint.model=${GROQ_CODING_HINT_MODEL:openai/gpt-oss-120b}
groq.api.key=${GROQ_API_KEY}


# =========================================================
# GEMINI
# =========================================================

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent
gemini.api.key=${GEMINI_API_KEY}


# =========================================================
# GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# FEEDBACK MODERATION
# =========================================================

feedback.moderation.owner-email=${FEEDBACK_OWNER_EMAIL}
feedback.moderation.base-url=http://localhost:8080


# =========================================================
# GOOGLE OAUTH2
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile


# =========================================================
# GITHUB OAUTH2
# =========================================================

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user,repo


# =========================================================
# FILE UPLOAD
# =========================================================

app.upload.dir=uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

resume.max-file-size=10485760


# =========================================================
# CODING ARENA / PISTON
# =========================================================

app.piston.url=http://localhost:2000/api/v2/execute

coding.hint.ollama.url=http://localhost:11434
coding.hint.ollama.model=mistral:latest


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${APP_JWT_SECRET:your-super-secret-key-at-least-32-characters-long}


# =========================================================
# PLAN PRICING
# =========================================================

plan.production.price.starter=0.0
plan.production.price.pro=399.0
plan.production.price.elite=799.0

plan.production.price.usd.pro=9.0
plan.production.price.usd.elite=19.0

plan.test.price.pro=1.0
plan.test.price.elite=2.0


# =========================================================
# REFERRAL PRICING
# =========================================================

plan.referral.discount.india.pro=299.0
plan.referral.discount.india.elite=699.0

plan.referral.discount.international.pro=8.0
plan.referral.discount.international.elite=18.0


# =========================================================
# INVOICE
# =========================================================

invoice.number.prefix=INV
invoice.due.days=30


# =========================================================
# CASHFREE PAYMENT GATEWAY
# =========================================================

cashfree.client.id=${CASHFREE_CLIENT_ID}
cashfree.client.secret=${CASHFREE_CLIENT_SECRET}
cashfree.environment=${CASHFREE_ENVIRONMENT:TEST}
cashfree.api.version=${CASHFREE_API_VERSION:2025-01-01}
cashfree.return.url=${CASHFREE_RETURN_URL:http://localhost:5173/payment/verify}
cashfree.webhook.url=${CASHFREE_WEBHOOK_URL:http://localhost:8080/api/payment/webhook}